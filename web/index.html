<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funding Tracker</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #e3e2dd; --accent: #2f5d8a; --accent-soft: #e6eef6;
    --open: #2e7d4f; --open-bg: #e5f3ea; --soon: #a15c00; --soon-bg: #fbefdc;
    --closed: #8a8a85; --closed-bg: #efefec; --bar: #4a7bab;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --surface: #1f1f1d; --text: #ecebe7; --muted: #a09f99;
      --border: #34332f; --accent: #8db7e0; --accent-soft: #24313d;
      --open: #7ccf9c; --open-bg: #1d3226; --soon: #f0b35c; --soon-bg: #3a2c16;
      --closed: #8f8e88; --closed-bg: #2a2a27; --bar: #6f9ccc;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
  h1 { font-size: 1.5rem; margin: 0; }
  .sub { color: var(--muted); font-size: .85rem; }
  a { color: var(--accent); }
  .btn { display: inline-block; padding: 7px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text); text-decoration: none; font-size: .9rem; }
  .btn:hover { border-color: var(--accent); }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .kpi .v { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .l { color: var(--muted); font-size: .8rem; }

  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; min-width: 0; }
  .panel h2 { font-size: .9rem; margin: 0 0 10px; font-weight: 600; }
  .hbar { display: grid; grid-template-columns: minmax(80px, 40%) 1fr auto; gap: 6px 8px; align-items: center; font-size: .82rem; }
  .hbar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .hbar .track { height: 12px; }
  .hbar .fill { height: 100%; background: var(--bar); border-radius: 0 3px 3px 0; min-width: 2px; }
  .months { display: flex; align-items: flex-end; gap: 4px; height: 110px; }
  .months .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .months .b { width: 70%; background: var(--bar); border-radius: 3px 3px 0 0; }
  .months .n { font-size: .7rem; color: var(--text); font-variant-numeric: tabular-nums; }
  .months .m { font-size: .68rem; color: var(--muted); margin-top: 3px; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .controls input, .controls select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text); font: inherit; font-size: .9rem; }
  .controls input[type=search] { flex: 1 1 220px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px;
    padding: 2px 10px; font-size: .78rem; cursor: pointer; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: .78rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  tr:last-child td { border-bottom: 0; }
  td .t { font-weight: 600; }
  td .f { color: var(--muted); font-size: .85rem; }
  td .note { color: var(--muted); font-size: .8rem; margin-top: 4px; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { background: var(--closed-bg); border-radius: 4px; padding: 0 6px; font-size: .75rem; }
  .badge { display: inline-block; border-radius: 4px; padding: 1px 7px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
  .s-open { color: var(--open); background: var(--open-bg); }
  .s-soon { color: var(--soon); background: var(--soon-bg); }
  .s-closed { color: var(--closed); background: var(--closed-bg); }
  .empty { padding: 24px; text-align: center; color: var(--muted); }

  @media (max-width: 760px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .charts { grid-template-columns: 1fr; }
    table, thead, tbody, tr, td { display: block; }
    thead { display: none; }
    tr { border-bottom: 1px solid var(--border); padding: 6px 0; }
    td { border: 0; padding: 4px 12px; }
    td[data-l]::before { content: attr(data-l) ": "; color: var(--muted); font-size: .78rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Funding Tracker</h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <a class="btn" href="deadlines.ics" download>Download calendar (.ics)</a>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="charts">
    <div class="panel"><h2>Opportunities by domain</h2><div class="hbar" id="byDomain"></div></div>
    <div class="panel"><h2>Upcoming deadlines, next 12 months</h2><div class="months" id="byMonth"></div></div>
  </section>

  <section class="controls">
    <input type="search" id="q" placeholder="Search title, funder, keywords, notes…" aria-label="Search">
    <select id="domain" aria-label="Domain"><option value="">All domains</option></select>
    <select id="status" aria-label="Status">
      <option value="active">Open + closing soon</option>
      <option value="">All statuses</option>
      <option value="open">Open</option>
      <option value="soon">Closing soon (≤ 30 days)</option>
      <option value="closed">Closed</option>
    </select>
    <select id="sort" aria-label="Sort">
      <option value="deadline">Sort: deadline</option>
      <option value="amount">Sort: max amount</option>
      <option value="title">Sort: title</option>
    </select>
  </section>
  <div class="chips" id="chips"></div>

  <table>
    <thead><tr><th>Opportunity</th><th>Amount</th><th>Deadline</th><th>Domain</th><th>Keywords</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
const SOON_DAYS = 30;
const state = { items: [], kw: new Set() };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function daysLeft(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((new Date(y, m - 1, d) - today) / 86400000);
}
function status(it) {
  const n = daysLeft(it.deadline);
  return n < 0 ? "closed" : n <= SOON_DAYS ? "soon" : "open";
}
function money(v, cur) {
  return new Intl.NumberFormat("en-US", { style: "currency", currency: cur || "USD", maximumFractionDigits: 0 }).format(v);
}
function amount(it) {
  const a = it.amount_min, b = it.amount_max, c = it.currency;
  if (a != null && b != null) return a === b ? money(b, c) : `${money(a, c)} – ${money(b, c)}`;
  if (b != null) return `up to ${money(b, c)}`;
  if (a != null) return `from ${money(a, c)}`;
  return "—";
}
function fmtDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
}

function tzAbbr(it) {
  if (!it.timezone) return "";
  try {
    const [y, m, d] = it.deadline.split("-").map(Number);
    return new Intl.DateTimeFormat("en-US", { timeZone: it.timezone, timeZoneName: "short" })
      .formatToParts(new Date(Date.UTC(y, m - 1, d, 12))).find(p => p.type === "timeZoneName").value;
  } catch { return it.timezone; }
}

function filtered() {
  const q = $("q").value.trim().toLowerCase();
  const dom = $("domain").value, st = $("status").value, sort = $("sort").value;
  let out = state.items.filter(it => {
    const s = status(it);
    if (st === "active" && s === "closed") return false;
    if (st && st !== "active" && s !== st) return false;
    if (dom && it.domain !== dom) return false;
    for (const k of state.kw) if (!it.keywords.includes(k)) return false;
    if (q) {
      const hay = [it.title, it.funder, it.domain, it.notes, it.amount_note, ...it.keywords].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const cmp = {
    deadline: (a, b) => a.deadline.localeCompare(b.deadline),
    amount: (a, b) => (b.amount_max ?? b.amount_min ?? -1) - (a.amount_max ?? a.amount_min ?? -1),
    title: (a, b) => a.title.localeCompare(b.title),
  }[sort];
  return out.sort(cmp);
}

function renderRows(list) {
  if (!list.length) { $("rows").innerHTML = `<tr><td colspan="5" class="empty">No opportunities match these filters.</td></tr>`; return; }
  $("rows").innerHTML = list.map(it => {
    const s = status(it), n = daysLeft(it.deadline);
    const label = s === "closed" ? "Closed" : n === 0 ? "Due today" : `${n} day${n === 1 ? "" : "s"} left`;
    const time = it.deadline_time ? `${esc(it.deadline_time)} ${esc(tzAbbr(it))}` : "";
    return `<tr>
      <td><div class="t"><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a></div>
          <div class="f">${esc(it.funder)}</div>${it.notes ? `<div class="note">${esc(it.notes)}</div>` : ""}</td>
      <td data-l="Amount"><span class="num">${amount(it)}</span>${it.amount_note ? `<div class="note">${esc(it.amount_note)}</div>` : ""}</td>
      <td data-l="Deadline"><span class="num">${fmtDate(it.deadline)}</span><div class="f">${time}</div>
          <span class="badge s-${s}">${label}</span></td>
      <td data-l="Domain">${esc(it.domain)}</td>
      <td data-l="Keywords"><div class="tags">${it.keywords.map(k => `<span class="tag">${esc(k)}</span>`).join("")}</div></td>
    </tr>`;
  }).join("");
}

function renderKpis() {
  const all = state.items, st = all.map(status);
  const active = all.filter((_, i) => st[i] !== "closed");
  const next = active[0];
  const kpi = (v, l) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  $("kpis").innerHTML =
    kpi(all.length, "Tracked") +
    kpi(st.filter(s => s !== "closed").length, "Open") +
    kpi(st.filter(s => s === "soon").length, `Closing in ≤ ${SOON_DAYS} days`) +
    kpi(next ? `${daysLeft(next.deadline)}d` : "—", next ? `Next: ${esc(next.title)}` : "Next deadline");
}

function renderCharts() {
  const counts = {};
  state.items.forEach(it => counts[it.domain] = (counts[it.domain] || 0) + 1);
  const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...rows.map(r => r[1]));
  $("byDomain").innerHTML = rows.map(([d, c]) =>
    `<div class="lab" title="${esc(d)}">${esc(d)}</div><div class="track"><div class="fill" style="width:${c / max * 100}%"></div></div><div class="num">${c}</div>`
  ).join("") || `<div class="lab">No data</div>`;

  const now = new Date(), months = [];
  for (let i = 0; i < 12; i++) months.push(new Date(now.getFullYear(), now.getMonth() + i, 1));
  const key = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  const mc = Object.fromEntries(months.map(m => [key(m), 0]));
  state.items.filter(it => status(it) !== "closed").forEach(it => { const k = it.deadline.slice(0, 7); if (k in mc) mc[k]++; });
  const mmax = Math.max(1, ...Object.values(mc));
  $("byMonth").innerHTML = months.map(m => {
    const c = mc[key(m)];
    return `<div class="col" title="${c} deadline(s)"><div class="n">${c || ""}</div>
      <div class="b" style="height:${c / mmax * 80}%"></div>
      <div class="m">${m.toLocaleDateString("en-US", { month: "short" })}</div></div>`;
  }).join("");
}

function renderChips() {
  const all = [...new Set(state.items.flatMap(it => it.keywords))].sort();
  $("chips").innerHTML = all.map(k => `<button class="chip${state.kw.has(k) ? " on" : ""}" data-k="${esc(k)}">${esc(k)}</button>`).join("");
}

function render() { renderRows(filtered()); }

fetch("data.json").then(r => r.json()).then(data => {
  state.items = data.opportunities;
  $("updated").textContent = `${state.items.length} opportunities · data updated ${new Date(data.generated).toLocaleDateString()}`;
  [...new Set(state.items.map(it => it.domain))].sort()
    .forEach(d => $("domain").insertAdjacentHTML("beforeend", `<option>${esc(d)}</option>`));
  renderKpis(); renderCharts(); renderChips(); render();
}).catch(() => { $("updated").textContent = "Could not load data.json"; });

["q", "domain", "status", "sort"].forEach(id => $(id).addEventListener("input", render));
$("chips").addEventListener("click", e => {
  const k = e.target.dataset?.k; if (!k) return;
  state.kw.has(k) ? state.kw.delete(k) : state.kw.add(k);
  e.target.classList.toggle("on"); render();
});
</script>
</body>
</html>
