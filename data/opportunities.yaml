# Funding opportunities tracked by the dashboard.
#
# One list item per opportunity. Required fields: id, title, funder, url,
# deadline, domain, keywords. Amounts are numbers (no commas or $).
#
#   id:            short unique slug, used for the .ics UID
#   title:         program name
#   funder:        funding organization
#   url:           official program page
#   deadline:      YYYY-MM-DD (next upcoming deadline)
#   deadline_time: optional, e.g. "15:00"
#   timezone:      optional IANA name, e.g. "America/New_York"
#   amount_min:    optional number
#   amount_max:    optional number
#   currency:      optional, default USD
#   amount_note:   optional free text (duration, caveats)
#   domain:        broad area, used for the domain filter and chart
#   keywords:      list of tags
#   notes:         optional free text

- id: bwf-cgt-2027
  title: Career Guidance for Trainees (CGT)
  funder: Burroughs Wellcome Fund
  url: https://www.bwfund.org/grants/career-guidance/career-guidance-for-trainees/
  deadline: 2027-01-13
  deadline_time: "15:00"
  timezone: America/New_York
  amount_min: 15000
  amount_max: 25000
  currency: USD
  amount_note: One-year pilot award, Aug 1, 2027 - Jul 31, 2028. BWF's 2025 annual report cites up to $50,000 (likely an older cap); confirm in the current RFP.
  domain: Biomedical sciences - career development
  keywords:
    - career readiness
    - trainees
    - graduate students
    - postdocs
    - pilot program
    - institutional grant
  notes: Funds practical, affordable and transferable career-readiness models. Applicants are institutions, professional societies and nonprofits. Firm deadline via BWF online system; notification end of May 2027.

- id: nsf-career-2027
  title: Faculty Early Career Development Program (CAREER)
  funder: National Science Foundation
  url: https://www.nsf.gov/funding/opportunities/career-faculty-early-career-development-program
  deadline: 2027-07-28
  deadline_time: "17:00"
  timezone: America/Denver
  amount_note: Five-year award. Minimum amount differs by directorate. Check source. Solicitation NSF 22-586 covers submissions through 2026, so confirm that a 2027 solicitation is posted. The deadline is the fourth Wednesday in July, once a year.
  domain: Earth and engineering sciences - early career
  keywords:
    - federal
    - early career
    - NSF
    - hydrology
    - flood modeling
    - AI for Earth science
    - hazards
  notes: "Added 2026-11-03. Not rolling. Eligibility: untenured assistant professor or equivalent at a US university on the deadline date, with a doctorate. Check source for tenure-status and prior-submission limits. Fit: the early-career vehicle for the flood modeling, hydrologic AI or Earth observation flood mapping work. Choose the home program (for example Hydrologic Sciences or an engineering program) before drafting."

- id: doe-sc-open-call-fy2027
  title: FY 2027 Continuation of Solicitation for the Office of Science Financial Assistance Program (Open Call)
  funder: U.S. Department of Energy, Office of Science
  url: https://science.osti.gov/grants/FOAs/FOAs/2027/DE-FOA-0003665
  deadline: 2027-09-30
  deadline_time: "23:59"
  timezone: America/New_York
  amount_note: Award size and duration are not stated in the sources I checked. Check source.
  domain: Earth system science - modeling and hydrology
  keywords:
    - federal
    - DOE
    - Biological and Environmental Research
    - Earth system modeling
    - hydrology
    - machine learning
    - high-performance computing
    - open call
  notes: "Added 2026-11-03. Rolling: yes. Opportunity DE-FOA-0003665, posted 2026-09-30, open until 2027-09-30 or until a successor notice replaces it. BER now takes most proposals through this call. Some programs set earlier target dates in Part 1, for example pre-applications by 2026-11-30 and applications by 2027-02-01 for FY2027 funding. Check which dates apply to BER. Eligibility: Check source. Fit: hydrologic simulation, coupled hydrologic-hydraulic modeling, AI for Earth system science and GPU/HPC work. The FY2027 budget request folds hydrology into Earth system modeling, so frame the work that way."

- id: amazon-ara-agentic-ai-fall-2026
  title: Amazon Research Awards, Fall 2026 - AWS Agentic AI
  funder: Amazon (Amazon Science)
  url: https://www.amazon.science/research-awards/call-for-proposals/aws-agentic-ai-call-for-proposals-fall-2026
  deadline: 2026-11-11
  deadline_time: "23:59"
  timezone: America/Los_Angeles
  amount_note: Unrestricted funds averaging up to $70,000 and AWS promotional credits averaging up to $50,000. The awards panel sets the final amount. Decision letters expected February 2027.
  domain: Artificial intelligence - agentic AI
  keywords:
    - non-federal
    - industry
    - Amazon
    - agentic AI
    - LLM
    - AWS credits
  notes: "Added 2026-11-03. Not rolling. Submission window 2026-10-01 to 2026-11-11. Proposals are encouraged to run up to 4 pages. Eligibility: awards go as unrestricted gifts to the PI's academic institution. Check the portal for PI rules. Fit: agentic AI and LLMs for hydrology, such as agents that run flood models or check physical consistency. Applicants must list the AWS tools they will use and any open-source contributions."

- id: nasa-roses25-a18-geosphere
  title: ROSES-2025 A.18 Geosphere
  funder: NASA Science Mission Directorate, Earth Science Division
  url: https://nspires.nasaprs.com/external/solicitations/summary.do?solNum=NNH25ZDA001N-GEO
  deadline: 2026-11-16
  amount_note: Check source for award size and duration. This date is the mandatory Notice of Intent. Full proposals are due 2027-01-15. A proposal without an on-time Notice of Intent is returned without review.
  domain: Earth observation - geohazards
  keywords:
    - federal
    - NASA
    - geohazards
    - cascading hazards
    - Earth observation
    - NISAR
    - landslides
  notes: "Added 2026-11-03. Not rolling. Program element NNH25ZDA001N-GEO, added by ROSES-2025 Amendment 77. Dual anonymous review. The S/T/M section is limited to 10 pages. It will not fund other federal institutions through interagency agreements. Eligibility: Check source for US university PI rules. Fit: partial. The scope is geohazards and how one hazard triggers another. The angle that matches Zhi's work is cascading hazards, such as rainfall-triggered landslides after floods, using NISAR or Sentinel-1 data."

- id: catalyst-fund-exploratory-2026
  title: Catalyst Fund, Research Software in the Age of AI - Exploratory Fund
  funder: Catalyst Fund (Research Software in the Age of AI)
  url: https://researchsoftwarecatalyst.fund/apply/
  deadline: 2026-12-31
  amount_max: 50000
  currency: USD
  amount_note: Up to $50,000 for 3 to 6 months of work. The total pool is still to be confirmed. A later Impact Fund (up to $200,000, 9 to 12 months) is planned to open in 2027.
  domain: Research software - AI-assisted research
  keywords:
    - non-federal
    - research software
    - AI-assisted research
    - scientific Python
    - open source
    - verification
    - exploratory grant
  notes: "Added 2026-11-04. Not rolling. One-time fund for the practices, tools and training that make AI-assisted research software reliable. Application is a two-page plain-language proposal with a simple budget and schedule. Programme chair: Karthik Ram (UC Berkeley). Eligibility: Check source. Deadline check: the date comes from search results that quote the official site. The site itself was not reachable from this session, and an older CURIOSS listing gave a late-October 2026 date, so confirm on the apply page. Fit: GPU-native hydraulic simulation code, scientific Python (PyTorch, xarray, Zarr) tooling, and benchmarks that test whether AI hydrologic models obey physics."
