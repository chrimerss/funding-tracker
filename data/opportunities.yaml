# Funding opportunities tracked by the dashboard.
#
# One list item per opportunity. Required fields: id, title, funder, url,
# deadline, domain, keywords. Amounts are numbers (no commas or $).
#
#   id:            short unique slug, used for the .ics UID
#   title:         program name
#   funder:        funding organization
#   url:           official program page
#   deadline:      YYYY-MM-DD (next upcoming deadline)
#   deadline_time: optional, e.g. "15:00"
#   timezone:      optional IANA name, e.g. "America/New_York"
#   amount_min:    optional number
#   amount_max:    optional number
#   currency:      optional, default USD
#   amount_note:   optional free text (duration, caveats)
#   domain:        broad area, used for the domain filter and chart
#   keywords:      list of tags
#   notes:         optional free text

